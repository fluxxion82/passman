org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion1.nowarn=true
ksp.useKSP2=true

android.useAndroidX=true

org.jetbrains.compose.experimental.jscanvas.enabled=true
compose.desktop.packaging.checkJdkVendor=false

# Single source for group and version across the whole repo. The root build applies both to
# every subproject; apps/desk turns VERSION_NAME into the packaged DMG/MSI/Deb version and the
# string Settings shows at runtime, apps/droid into versionName.
#
# VERSION_CODE is Android-only. Play requires it to strictly increase on every upload, so bump
# it whenever VERSION_NAME changes — it is not derived from the version string.
GROUP=ai.passman
VERSION_NAME=1.0.4
VERSION_CODE=7
